services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: rootshare-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: rootshare
      MONGO_INITDB_ROOT_PASSWORD: rootshare123
      MONGO_INITDB_DATABASE: rootshare
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - rootshare-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:

networks:
  rootshare-network:
    driver: bridge
